[project]
name = "jurisprudencia-tjma-mcp"
version = "0.1.0"
description = "Servidor MCP para pesquisa de jurisprudência na API oficial do TJ-MA (Jurisconsult): busca, leitura de decisões e verificação de citações"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jurisprudencia-tjma-mcp = "jurisprudencia_tjma_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
